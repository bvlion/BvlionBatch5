name: cloud-glance Production Deploy

on:
  push:
    tags: ['cloud-glance-v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-glance-production-deploy
  cancel-in-progress: false

jobs:
  cloud-glance-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud-glance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cloud-glance/package-lock.json
            cloud-glance/functions/package-lock.json
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run build
      - name: Prepare runtime environment
        env:
          CLOUD_GLANCE_RUNTIME_ENV: ${{ secrets.CLOUD_GLANCE_RUNTIME_ENV }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { parseEnv } from 'node:util';
          try {
            const values = parseEnv(process.env.CLOUD_GLANCE_RUNTIME_ENV || '');
            const required = ['HOME_GOOGLE_ACCOUNT', 'OPENAI_API_KEY', 'INCOMING_WEBHOOK_URL', 'HOME_LOCATION', 'SLACK_POST_SETTINGS'];
            if (Object.keys(values).length !== required.length ||
                required.some(key => !Object.hasOwn(values, key)) ||
                !values.HOME_GOOGLE_ACCOUNT.trim() || !values.OPENAI_API_KEY.trim() ||
                !/^https:\/\//i.test(values.INCOMING_WEBHOOK_URL)) throw new Error();
            const settings = JSON.parse(values.SLACK_POST_SETTINGS);
            if (!settings || typeof settings !== 'object' || Array.isArray(settings) ||
                Object.entries(settings).some(([key, value]) =>
                  !['channel', 'username', 'icon_url'].includes(key) || typeof value !== 'string')) throw new Error();
          } catch {
            console.error('::error::CLOUD_GLANCE_RUNTIME_ENV is missing or invalid.');
            process.exitCode = 1;
          }
          NODE
          umask 077
          temp=$(mktemp functions/.env.b-glance.tmp.XXXXXX)
          trap 'rm -f "$temp"' EXIT
          printf '%s\n' "$CLOUD_GLANCE_RUNTIME_ENV" > "$temp"
          mv -- "$temp" functions/.env.b-glance
      - name: Authenticate to b-glance
        uses: google-github-actions/auth@v3
        with:
          project_id: b-glance
          workload_identity_provider: ${{ secrets.CLOUD_GLANCE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.CLOUD_GLANCE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy cloud-glance Hosting and one HTTP function
        run: npx --no-install firebase deploy --project b-glance --only hosting,functions:cloud-glance:cloudGlance --non-interactive
      - name: Verify Hosting and unauthenticated access
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://b-glance.web.app/ > /dev/null
          status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' https://b-glance.web.app/api/session)
          test "$status" = 401
      - name: Remove temporary runtime environment file
        if: always()
        run: rm -f functions/.env.b-glance

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DB_HOST: 127.0.0.1

    services:
      database:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: example_database
          MYSQL_USER: example_database_user
          MYSQL_PASSWORD: example_database_password
          MYSQL_ROOT_PASSWORD: example_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1
          -uroot -pexample_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: curl, imap, mbstring, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check PHP syntax
        run: composer lint

      - name: Check coding standard
        run: composer style

      - name: Run tests
        run: composer test

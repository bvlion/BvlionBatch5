name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ローカルの検証用Compose(compose.check.yaml)と同じ安全な入口を使用する。
      # make check は検証専用のCompose project(bvlionbatch5-check)だけを使い、
      # 成功・失敗にかかわらず自分自身でそのprojectをcleanupする。
      - name: make check
        run: make check
